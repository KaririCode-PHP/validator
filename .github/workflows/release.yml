name: Release

# ARFA 1.3 / KaririCode Spec V4.0 — Release Pipeline
# Triggers on semantic version tags (v*).
# Full quality gate (kcode quality) must pass before release is published.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Quality Gate + GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # PHP 8.4 + pcov: releases MUST pass with coverage (ARFA 1.3 §Testing)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml
          coverage: pcov
          tools: composer:v2

      # --no-scripts prevents accidental environment pollution during release
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Install kcode (KaririCode Devkit)
        run: |
          wget -q https://github.com/KaririCode-PHP/devkit/releases/latest/download/kcode.phar
          chmod +x kcode.phar
          sudo mv kcode.phar /usr/local/bin/kcode

      - name: Initialize devkit
        run: kcode init

      # Patch generated phpunit.xml.dist — beStrictAboutCoverageMetadata causes false
      # "not a valid target" warnings for classes extending vendor base classes
      - name: Patch phpunit.xml.dist
        run: |
          sed -i 's/beStrictAboutCoverageMetadata="true"/beStrictAboutCoverageMetadata="false"/' .kcode/phpunit.xml.dist

      # Full pipeline: cs-fixer → phpstan (L9) → psalm → phpunit (pcov)
      # Exit code ≠ 0 aborts the release — zero tolerance (ARFA 1.3)
      - name: Run full quality pipeline (release gate)
        run: kcode quality

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: KaririCode Validator ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## KaririCode\Validator ${{ steps.version.outputs.tag }}

            Composable, rule-based data validation engine for PHP 8.4+.
            57 built-in rules across 10 namespaces, `#[Validate]` attribute-driven
            pipelines, i18n messages (EN, PT-BR, ES), cross-field validation,
            zero runtime dependencies, and 100% test coverage. **ARFA 1.3 compliant.**

            ## Installation

            ```bash
            composer require kariricode/validator
            ```

            ## Quick Start

            ```php
            use KaririCode\Validator\Attribute\Validate;
            use KaririCode\Validator\Provider\ValidatorServiceProvider;

            final class CreateUserRequest
            {
                public function __construct(
                    #[Validate('required', 'email')]
                    public string $email,

                    #[Validate('required', ['length', ['min' => 8]])]
                    public string $password,

                    #[Validate('required', 'cpf')]
                    public string $cpf,
                ) {}
            }

            $validator = (new ValidatorServiceProvider())->createAttributeValidator();
            $result    = $validator->validate(new CreateUserRequest(
                email: 'walmir@kariricode.org',
                password: 'strongpass',
                cpf: '529.982.247-25',
            ));
            ```

            ## Quality Metrics

            | Metric | Value |
            |--------|-------|
            | PHPStan Level | 9 (0 errors) |
            | Psalm | 100% (0 errors) |
            | Coverage | 100% |
            | Rules | 57 built-in across 10 namespaces |
            | i18n languages | 3 (EN, PT-BR, ES) |
            | Dependencies | 0 (runtime) |
            | PHP Version | 8.4+ |

            See [CHANGELOG.md](CHANGELOG.md) for details.
